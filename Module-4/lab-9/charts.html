<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eCharts</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.1/dist/echarts.min.js"></script>
  </head>
  <body>
    <!-- Prepare a DOM with a defined width and height for ECharts -->
    <div id="main" style="width: 900px; height: 600px"></div>
    <script type="text/javascript">
      // Specify the configuration items and data for the chart
      let options = {
        title: { text: "Fake Store Categories" },
        xAxis: {
          data: ["Category 1", "Category 2", "Category 3", "Category 4"],
        },
        yAxis: {},
        series: [
          {
            name: "# products",
            type: "bar",
            data: [0, 1, 5, 2],
          },
        ],
      };
      fetch("https://fakestoreapi.com/products")
        .then((response) => response.json())
        .then((json) => {
          console.log(json); // use this JSON to find and set correct option data for the chart
          const categories = new Set();
          const amounts = {};
          for (const product of json) {
            categories.add(product.category);
            if (product.category in amounts) amounts[product.category]++;
            else amounts[product.category] = 1;
          }

          const categoriesData = [];
          const amountsData = [];

          for (const categoryName of categories) {
            categoriesData.push(categoryName);
            amountsData.push(amounts[categoryName]);
          }

          options.xAxis.data = categoriesData;
          options.series[0].data = amountsData;
        })
        .then(() => {
          // Display the chart
          myChart.setOption(options);
        }); // Initialize the echarts instance based on the prepared div
      let myChart = echarts.init(document.getElementById("main"));
    </script>
  </body>
</html>
